name: Deploy Main Branch to Server

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_DEV_HOST_IP }}
          username: github_user
          key: ${{ secrets.SSH_DEV_PRIVATE_KEY }}
          script: |
            cd /home/github_user/workspace/MiniRag
            git checkout main
            git pull
            sudo systemctl restart minirag.service
            echo "Waiting...."
            sleep 20