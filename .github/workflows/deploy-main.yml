name: Deploy Main Branch to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy Locally
        run: |
          cd /home/github_user/workspace/MiniRag
          git checkout develop
          git pull
          sudo systemctl restart minirag.service
          echo "Waiting..."
          sleep 20

          for i in {1..6}; do
            if ss -tuln | grep -q ':80'; then
              echo "✅ Port 80 is now active."
              break
            else
              echo "⏳ Port 80 not ready yet. Retrying in 5 seconds..."
              sleep 5
            fi
          done

          if ! ss -tuln | grep -q ':80'; then
            echo "❌ Service failed to start on port 80"
            exit 1
          fi
